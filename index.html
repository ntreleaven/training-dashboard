const PRESC = { Easy:'50–70 min easy', Long:'70–80 min long', Rest:'Rest from running', Workout:'Quality workout', 'Cross train':'Cross-training' };

function isoDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function shortDate(d) {
  return MONTHS[d.getMonth()] + ' ' + d.getDate();
}
function riegelTime(t, d1, d2) {
  return t * Math.pow(d2 / d1, 1.06);
}
function parsePaceStr(str) {
  const m = /^(\d+):(\d{1,2})$/.exec((str||'').trim());
  if (!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = x.getDay();
  x.setDate(x.getDate() + (dow === 0 ? -6 : 1 - dow));
  return x;
}
function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
function weekNumberFor(monday, startIso) {
  const start = mondayOf(new Date((startIso || PROGRAM_START_ISO) + 'T00:00:00'));
  const diffDays = Math.round((monday - start) / 86400000);
  return Math.max(1, Math.min(8, Math.floor(diffDays / 7) + 1));
}
function generateWeek(monday, todayIso, weekNum) {
  const template = (weekNum && WEEKLY_TEMPLATES[weekNum]) || WEEK_TEMPLATE;
  return template.map((t, i) => {
    const d = addDays(monday, i);
    const iso = isoDate(d);
    return {
      id: i+1, day: t.day, date: shortDate(d), iso,
      type: t.type, presc: PRESC[t.type], km: t.km,
      strides: t.strides, core: t.core, strength: t.strength,
      status: iso === todayIso ? 'today' : 'upcoming',
      stravaId: null,
      crossTrain: null,
      manual: false,
    };
  });
}

function cssToObj(str) {
  const out = {};
  if (!str) return out;
  str.split(';').forEach(rule => {
    const idx = rule.indexOf(':');
    if (idx === -1) return;
    let prop = rule.slice(0, idx).trim();
    const val = rule.slice(idx + 1).trim();
    if (!prop || !val) return;
    prop = prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    out[prop] = val;
  });
  return out;
}

function loadSaved() {

    return raw ? JSON.parse(raw) : {};

class App extends React.Component {
  constructor(props) {
    super(props);
    const saved = loadSaved();
    if (saved.planVersion !== PLAN_VERSION) {
      const monday = mondayOf(new Date());
      const weekNum = weekNumberFor(monday, PROGRAM_START_ISO);
      const freshWeek = generateWeek(monday, isoDate(new Date()), weekNum);
      if (Array.isArray(saved.week) && saved.week.length === freshWeek.length) {
        saved.week = freshWeek.map((d, i) => {
          const prev = saved.week[i];
          if (!prev || prev.iso !== d.iso) return d;
          if (prev.manual) return prev;
          return { ...d, status: prev.status, stravaId: prev.stravaId, crossTrain: prev.crossTrain, manual: prev.manual,
            km: prev.status === 'done' ? prev.km : d.km };
        });
      } else {
        saved.week = freshWeek;
      }
      saved.programStart = PROGRAM_START_ISO;
      saved.selectedWeek = weekNum;
      delete saved.workouts;
      if (Array.isArray(saved.races)) {
        saved.races = saved.races.map(r => r.id === 4
          ? { ...r, label:'Hamilton Invitational', location:'Christie Lake Conservation Area \u00b7 Dundas, ON', tag:'OUA & U SPORTS Selection' }
          : r);
      }
      saved.planVersion = PLAN_VERSION;
    }
    if (saved.weight && saved.weight.some(w => typeof w.lb !== 'number')) {
      saved.weight = [];
    }
    if (saved.supps && !Array.isArray(saved.supps)) {
      delete saved.supps;
    }
    if (saved.view === 'goals') {
      saved.view = 'overview';
    }
    this.state = { ...defaultState, ...saved, modal: null, form: {}, stravaConnected: false, stravaChecked: false, garmin: null, garminError: null };
  }

  componentDidMount() {
    this._onResize = () => this.setState({ isNarrow: window.innerWidth < 900 });
    this._onResize();
    window.addEventListener('resize', this._onResize);
    this.ensureCurrentWeek();
    this.cleanStravaRedirectParams();
    this.syncStrava();
    this.syncGarmin();
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }

  ensureCurrentWeek = () => {
    const today = new Date();
    const monday = mondayOf(today);
    const todayIso = isoDate(today);
    const mondayIso = isoDate(monday);

    this.setState(s => {
      const first = s.week[0];
      if (first && first.iso === mondayIso) {
        const stale = s.week.some(r => (r.iso === todayIso ? r.status !== 'today' && r.status !== 'done' : r.status === 'today'));
        if (!stale) return null;
        return { week: s.week.map(r => {
          if (r.status === 'done') return r;
          if (r.iso === todayIso) return { ...r, status: 'today' };
          if (r.status === 'today') return { ...r, status: 'upcoming' };
          return r;
        }) };
      }

      const bankedKm = s.week.reduce((a,r) => a + (r.status==='done' ? r.km : 0), 0);
      const prevCurrent = s.weeks.find(w => w.current);
      const carryTarget = prevCurrent && prevCurrent.target != null ? prevCurrent.target : s.weekTarget;
      let weeks = s.weeks.map(w => ({ ...w, current:false }));
      if (first && first.iso) {
        const label = shortDate(new Date(first.iso + 'T00:00:00'));
        const idx = weeks.findIndex(w => w.l === label);
        if (idx >= 0) weeks[idx] = { ...weeks[idx], l: label, km: bankedKm };
      }
      weeks = [...weeks, { l: shortDate(monday), km: 0, target: carryTarget, current: true }].slice(-5);

      const weekNum = weekNumberFor(monday, s.programStart);
      return {
        week: generateWeek(monday, todayIso, weekNum),
        weeks,
        weekTarget: carryTarget,
        selectedWeek: weekNum,
      };
    });
  };

  cleanStravaRedirectParams = () => {
    const params = new URLSearchParams(window.location.search);
    if (params.has('strava')) {
      params.delete('strava');
      const qs = params.toString();
      window.history.replaceState({}, '', window.location.pathname + (qs ? '?'+qs : ''));
    }
  };

  syncStrava = async () => {
    try {
      const statusRes = await fetch('/api/strava/status');
      const status = await statusRes.json();
      this.setState({ stravaConnected: !!status.connected, stravaChecked: true });
      if (!status.connected) return;
      const currentMonday = mondayOf(new Date());
      const afterEpoch = Math.floor(addDays(currentMonday, -28).getTime() / 1000);
      const actRes = await fetch('/api/strava/activities?after=' + afterEpoch);
      const data = await actRes.json();
      if (!data.connected || !Array.isArray(data.activities)) return;
      const byDate = {};
      data.activities.forEach(a => {
        const cur = byDate[a.date];
        if (!cur || (a.sport === 'Run' && cur.sport !== 'Run')) byDate[a.date] = a;
      });
      const priorMondays = [4,3,2,1].map(n => addDays(currentMonday, -n*7));
      this.setState(s => {
        const weekIsos = new Set(s.week.map(r => r.iso));
        const crossTrainLog = data.activities
          .filter(a => a.sport !== 'Run' && weekIsos.has(a.date))
          .map(a => ({ id: a.id, iso: a.date, sport: a.sport, km: a.distance_km, min: a.moving_time_min }))
          .sort((a,b) => a.iso.localeCompare(b.iso));
        const histWeeks = priorMondays.map(m => {
          const startIso = isoDate(m), endIso = isoDate(addDays(m,6));
          const km = data.activities
            .filter(a => a.sport === 'Run' && a.date >= startIso && a.date <= endIso)
            .reduce((sum,a) => sum + a.distance_km, 0);
          const label = shortDate(m);
          const prevWeek = s.weeks.find(w => w.l === label);
          const target = prevWeek && prevWeek.target != null ? prevWeek.target : s.weekTarget;
          return { l: label, km: Math.round(km), target };
        });
        const currentWeekStartIso = isoDate(currentMonday), currentWeekEndIso = isoDate(addDays(currentMonday, 6));
        const currentWeekKm = data.activities
          .filter(a => a.sport === 'Run' && a.date >= currentWeekStartIso && a.date <= currentWeekEndIso)
          .reduce((sum,a) => sum + a.distance_km, 0);
        const prevCurrentEntry = s.weeks.find(w => w.current) || s.weeks[s.weeks.length-1] || {};
        const currentWeekEntry = { ...prevCurrentEntry, l: shortDate(currentMonday), km: Math.round(currentWeekKm), current: true };
        return {
          week: s.week.map(r => {
            if (r.manual) return r;
            const a = byDate[r.iso];
            if (!a) return r;
            if (a.sport === 'Run') {
              return { ...r, status: 'done', km: a.distance_km, stravaId: a.id, crossTrain: null };
            }
            return { ...r, status: 'done', stravaId: a.id, crossTrain: { sport: a.sport, km: a.distance_km, min: a.moving_time_min } };
          }),
          crossTrainLog,
          weeks: [...histWeeks, currentWeekEntry],
        };
      });
    } catch (e) {
      this.setState({ stravaChecked: true });
    }
  };

  computeReadiness(sleep, soreness, shin) {
    let readiness = 70 + Math.round((sleep-7)*8);
    if (soreness==='Low') readiness += 6; if (soreness==='High') readiness -= 12;
    if (shin==='sore') readiness -= 15; if (shin==='watch') readiness -= 6;
    return Math.max(35, Math.min(97, readiness));
  }

  syncGarmin = async () => {
    try {
      const res = await fetch('/api/garmin/recovery');
      const data = await res.json();
      if (!data.connected) {
        this.setState({ garmin: null, garminError: data.error || 'Garmin sync unavailable' });
        return;
      }
      this.setState(s => {
        const sleep = data.sleepHours != null ? data.sleepHours : s.recovery.sleep;
        const readiness = this.computeReadiness(sleep, s.recovery.soreness, s.recovery.shin);
        return { garmin: data, garminError: null, recovery: { ...s.recovery, sleep, readiness } };
      });
    } catch (e) {
      this.setState({ garmin: null, garminError: 'Could not reach the dashboard server' });
    }
  };

  submit = () => {
    const { modal, form } = this.state;
    if (modal==='run') {
      const km = parseFloat(form.km)||0;
      const row = this.state.week.find(r => r.day===form.day);
      if (row) this.editDaySession(row.id, { type:form.type, km, status:'done' });
      this.setState({ modal:null });
    } else if (modal==='weight') {
      const lb = parseFloat(form.lb);
      if (lb) this.setState(s => ({ weight: [...s.weight, {d: this.formatShort(new Date()), lb: Math.round(lb*10)/10}], modal:null }));
      else this.setState({ modal:null });
    } else if (modal==='checkin') {
      const sleep = Math.round((parseFloat(form.sleep)||this.state.recovery.sleep)*10)/10;
      const readiness = this.computeReadiness(sleep, form.soreness, form.shin);
      const logEntry = { id:Date.now(), d:this.formatShort(new Date()), sleep, soreness:form.soreness, shin:form.shin, readiness };
      this.setState(s => ({
        recovery: {...s.recovery, sleep, soreness:form.soreness, shin:form.shin, readiness},
        checkinLog: [...s.checkinLog, logEntry],
        modal:null,
      }));
    } else if (modal==='race') {
      const { id, date, sub, label, location, tag } = form;
      if (!date || !label) { this.setState({ modal:null }); return; }
      this.setState(s => {
        let races;
        if (id) {
          races = s.races.map(r => r.id===id ? { ...r, iso:date, sub: sub&&sub!=='none'?sub:null, label, location, tag } : r);
        } else {
          races = [...s.races, { id:Date.now(), iso:date, sub: sub&&sub!=='none'?sub:null, label, location, tag, isGoal:false }];
        }
        races.sort((a,b) => a.iso.localeCompare(b.iso));
        return { races, modal:null };
      });
    } else if (modal==='raceResult') {
      const { id, time, place, note } = form;
      this.setState(s => ({
        races: s.races.map(r => r.id === Number(id)
          ? { ...r, result: time.trim() ? { time: time.trim(), place:(place||'').trim(), note:(note||'').trim() } : null }
          : r),
        modal: null,
      }));
    } else if (modal==='target') {
      const wt = parseFloat(form.weekTarget);
      if (wt > 0) this.setWeekTarget(form.weekLabel, wt);
      else this.setState({ modal:null });
    } else if (modal==='session') {
      const { id, type, km, strides, core, strength } = form;
      this.editDaySession(Number(id), {
        type, km: parseFloat(km)||0, strides: strides==='yes', core: core==='yes',
        strength: strength && strength!=='none' ? strength : null,
      });
      this.setState({ modal:null });
    } else if (modal==='cross') {
      const min = parseInt(form.min, 10) || 0;
      if (!min) { this.setState({ modal:null }); return; }
      const km = parseFloat(form.km) || 0;
      this.setState(s => {
        const row = s.week.find(r => r.day === form.day);
        const iso = row ? row.iso : isoDate(new Date());
        const entry = { id: 'm'+Date.now(), iso, sport: form.sport, km: Math.round(km*10)/10, min, manual:true };
        return { manualCross: [...s.manualCross, entry], modal:null };
      });
    } else if (modal==='weightGoal') {
      const wg = parseFloat(form.weightGoal);
      if (wg > 0) this.setState({ weightGoal: wg, modal:null });
      else this.setState({ modal:null });
    } else if (modal==='paceGoal') {
      const sec = parsePaceStr(form.pace);
      if (sec > 0) this.setState({ paceGoalSec: sec, modal:null });
      else this.setState({ modal:null });
    } else if (modal==='profile') {
      const name = (form.name||'').trim() || this.state.profile.name;
      const team = (form.team||'').trim();
      const tier = (form.tier||'').trim();
      this.setState({ profile: { name, team, tier }, modal:null });
    } else if (modal==='programSettings') {
      if (form.programStart) this.setState({ programStart: form.programStart, modal:null });
      else this.setState({ modal:null });
    } else if (modal==='supp') {
      const name = (form.name||'').trim();
      if (!name) { this.setState({ modal:null }); return; }
      this.addSupp(name, (form.note||'').trim());
      this.setState({ modal:null });
    } else if (modal==='lift') {
      const { sessionKey, liftId, n, s, meta } = form;
      if (!n.trim() || !s.trim()) { this.setState({ modal:null }); return; }
      const patch = { n:n.trim(), s:s.trim(), meta:(meta||'').trim() };
      if (liftId) this.editLift(sessionKey, liftId, patch);
      else this.addLift(sessionKey, patch);
      this.setState({ modal:null });
    } else if (modal==='sessionMeta') {
      const { letter, name, day, focus } = form;
      this.editSessionMeta(letter, { name: (name||'').trim() || ('Strength '+letter), day, focus: (focus||'').trim() });
      this.setState({ modal:null });
    } else if (modal==='workoutMeta') {
      const { weekNum, phase, note, long } = form;
      this.editWorkoutMeta(Number(weekNum), { phase, note:(note||'').trim(), long:(long||'').trim() });
      this.setState({ modal:null });
    } else if (modal==='keySession') {
      const { weekNum, sessionId, day, name, presc, pace } = form;
      if (!name.trim() || !presc.trim()) { this.setState({ modal:null }); return; }
      const patch = { day, name:name.trim(), presc:presc.trim(), pace:(pace||'').trim() };
      if (sessionId) this.editKeySession(Number(weekNum), sessionId, patch);
      else this.addKeySession(Number(weekNum), patch);
      this.setState({ modal:null });
    }
  };

                </div>
                <div style={{gridColumn:'1/-1',background:'#FFFFFF',border:'1px solid #E4DEF0',borderRadius:22,padding:24,boxShadow:'0 1px 2px rgba(36,26,56,.04), 0 10px 26px -18px rgba(36,26,56,.20)'}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                    <div style={{fontFamily:"'Bricolage Grotesque'",fontWeight:700,fontSize:17}}>Weight over time</div>
                    <div style={{display:'flex',gap:14,fontSize:12}}>
                      <span style={{display:'inline-flex',alignItems:'center',gap:5,color:'#7C7591'}}><span style={{width:14,height:2,background:'#4B2E83',display:'inline-block'}}></span>weight</span>
                      <span style={{display:'inline-flex',alignItems:'center',gap:5,color:'#7C7591'}}><span style={{width:14,height:0,borderTop:'2px dashed #2F8F5B',display:'inline-block'}}></span>goal</span>
                    </div>
                  </div>
                  {v.weightChart}
                </div>
                <div style={{gridColumn:'1/-1',background:'#FFFFFF',border:'1px solid #E4DEF0',borderRadius:22,padding:24,boxShadow:'0 1px 2px rgba(36,26,56,.04), 0 10px 26px -18px rgba(36,26,56,.20)'}}>
                  <div style={{fontFamily:"'Bricolage Grotesque'",fontWeight:700,fontSize:17,marginBottom:10}}>Recent entries</div>
                  <div style={{display:'flex',flexDirection:'column'}}>
                    {v.weightLog.map((w,i) => (
                      <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0',borderBottom:'1px solid #ECE6F5'}}>
                        <span style={{fontSize:14,color:'#7C7591'}}>{w.d}</span>
                        <span style={{fontFamily:"'Bricolage Grotesque'",fontWeight:700,fontSize:16}}>{w.lb} lb</span>
                      </div>
                    ))}
                  </div>
                </div>
                </>)}
              </div>
            )}


            {v.isRaces && (
              <div style={{display:'flex',flexDirection:'column',gap:16,animation:'fadeUp .45s ease both'}}>
                <div style={{background:'#FFFFFF',border:'1px solid #E4DEF0',borderRadius:22,padding:24,boxShadow:'0 1px 2px rgba(36,26,56,.04), 0 10px 26px -18px rgba(36,26,56,.20)'}}>
                  <div style={{fontFamily:"'Bricolage Grotesque'",fontWeight:700,fontSize:17,marginBottom:16}}>Race season</div>
                  <div style={{display:'flex',flexDirection:'column'}}>
                    {v.races.map((r,i) => (
                      <div key={i} style={{display:'flex',alignItems:'center',gap:16,padding:'16px 0',borderBottom: i<v.races.length-1 ? '1px solid #ECE6F5' : 'none', opacity: (r.isPast && !r.result) ? .55 : 1}}>
                        <div style={{width:60,flex:'none',textAlign:'center'}}>
                          <div style={{fontFamily:"'Bricolage Grotesque'",fontWeight:700,fontSize:14}}>{r.dateLabel}</div>
                          <div style={{fontSize:11,color:'#9B93AE'}}>{r.day}</div>
                        </div>
                        <span style={{padding:'4px 10px',borderRadius:999,fontSize:11,fontWeight:700,background:r.tagBg,color:r.tagColor,flex:'none',whiteSpace:'nowrap'}}>{r.tag}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:700,fontSize:15}}>{r.sub ? r.sub+' ' : ''}{r.label}</div>
                          <div style={{fontSize:13,color:'#7C7591'}}>{r.location}</div>
                          {r.result && (
                            <div style={{fontSize:13,fontWeight:700,color:r.resultColor,marginTop:4}}>
                              {r.result.time}{r.result.place ? ' · ' + r.result.place : ''}
                              {r.result.note ? <span style={{color:'#7C7591',fontWeight:500}}>{' — ' + r.result.note}</span> : null}
                            </div>
                          )}
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:4,flex:'none'}}>
                          {r.isPast && (
                            <button onClick={r.onLogResult} title={r.result ? 'Edit result' : 'Log result'} style={{width:28,height:28,borderRadius:8,fontSize:13,color: r.result?r.resultColor:'#7C7591'}}>⏱</button>
                          )}
                          <button onClick={r.onSetGoal} title="Set as goal race" style={{width:28,height:28,borderRadius:8,fontSize:15,color: r.isGoal?'#C9A227':'#D6CCE8'}}>{r.isGoal?'★':'☆'}</button>
                          <button onClick={r.onEdit} title="Edit race" style={{width:28,height:28,borderRadius:8,color:'#7C7591',fontSize:13}}>✎</button>
                          <button onClick={r.onDelete} title="Delete race" style={{width:28,height:28,borderRadius:8,color:'#7C7591',fontSize:13}}>✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>

        {v.isNarrow && (
          <nav style={{position:'sticky',bottom:0,zIndex:20,display:'flex',justifyContent:'space-between',padding:'8px 6px 10px',background:'rgba(255,255,255,.95)',backdropFilter:'blur(10px)',borderTop:'1px solid #E4DEF0'}}>
            {v.nav.map((item,i) => (
              <button key={i} onClick={item.onClick} style={cssToObj(item.tabStyle)}>
                <span style={{display:'flex',width:21,height:21,alignItems:'center',justifyContent:'center'}}>{item.icon}</span>
                <span style={{fontSize:9.5,fontWeight:600}}>{item.label}</span>
              </button>
            ))}
          </nav>
        )}

        {v.modal && (
          <div onClick={v.closeModal} style={{position:'fixed',inset:0,zIndex:40,background:'rgba(36,26,56,.45)',backdropFilter:'blur(3px)',display:'flex',alignItems:'flex-end',justifyContent:'center',animation:'overlayIn .2s ease'}}>
            <div onClick={v.stop} style={{background:'#FFFFFF',width:'100%',maxWidth:440,borderRadius:'22px 22px 0 0',padding:26,animation:'sheetIn .28s cubic-bezier(.2,.8,.2,1)'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
                <h2 style={{margin:0,fontFamily:"'Bricolage Grotesque'",fontSize:21,fontWeight:800}}>{v.modalTitle}</h2>
                <button onClick={v.closeModal} style={{width:32,height:32,borderRadius:10,background:'#ECE6F5',color:'#7C7591',fontSize:16}}>✕</button>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:14}}>
                {v.formFields.map((f,i) => (
                  <label key={i} style={{display:'block'}}>
                    <span style={{display:'block',fontSize:13,fontWeight:600,color:'#5B5470',marginBottom:6}}>{f.label}</span>
                    {f.isSelect ? (
                      <select value={f.value} onChange={f.onChange} style={{width:'100%',padding:'12px 13px',borderRadius:12,border:'1.5px solid #E4DEF0',fontSize:15,background:'#fff',color:'#241A38'}}>
                        {f.options.map((o,oi) => <option key={oi} value={o}>{o}</option>)}
                      </select>
                    ) : (
                      <input value={f.value} onChange={f.onChange} type={f.type} placeholder={f.placeholder} style={{width:'100%',padding:'12px 13px',borderRadius:12,border:'1.5px solid #E4DEF0',fontSize:15,color:'#241A38'}} />
                    )}
                  </label>
                ))}
              </div>
              <button onClick={v.submitModal} style={{width:'100%',marginTop:22,background:'#4B2E83',color:'#fff',fontWeight:600,fontSize:15,padding:15,borderRadius:14,boxShadow:'0 8px 18px -8px rgba(75,46,131,.35)'}}>{v.submitLabel}</button>
            </div>
          </div>
        )}

      </div>
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
